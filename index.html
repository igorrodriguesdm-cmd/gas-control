<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-top: 10px; }
        .login-header p { font-size: 14px; color: var(--muted); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
        .input-group input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; background: var(--primary); font-size: 15px; transition: opacity 0.2s; }
        .btn-login:hover { opacity: 0.9; }
        .error-msg { background: #fee2e2; color: var(--danger); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-fire-flame-curved fa-2x" style="color: var(--primary);"></i>
            <h1>GasControl</h1>
            <p>Entre com suas credenciais</p>
        </div>

        <div id="msg-erro" class="error-msg"></div>

        <form id="form-login">
            <div class="input-group">
                <label>Usuário / Matrícula</label>
                <input type="text" id="usuario" required placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btn-entrar">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-n9ns.onrender.com';

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const btnEntrar = document.getElementById('btn-entrar');
            const msgErro = document.getElementById('msg-erro');

            msgErro.style.display = 'none';
            btnEntrar.disabled = true;
            btnEntrar.innerText = 'Conectando ao servidor...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('usuario', JSON.stringify(data));
                    if (data.tipo === 'admin') {
                        window.location.href = 'tela_admin.html';
                    } else {
                        window.location.href = 'tela_deposito.html';
                    }
                } else {
                    msgErro.innerText = data.erro || 'Usuário ou senha incorretos.';
                    msgErro.style.display = 'block';
                    btnEntrar.disabled = false;
                    btnEntrar.innerText = 'Entrar no Sistema';
                }
            } catch (err) {
                msgErro.innerText = 'O servidor no Render está acordando. Aguarde 30 segundos e tente de novo.';
                msgErro.style.display = 'block';
                btnEntrar.disabled = false;
                btnEntrar.innerText = 'Entrar no Sistema';
            }
        });
    </script>
</body>
</html>
