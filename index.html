<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: var(--card); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .login-card h2 { margin-bottom: 24px; font-size: 22px; text-align: center; color: var(--primary); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: var(--primary); }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }
        #mensagem-erro { color: var(--danger); font-size: 13px; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>GasControl - Acesso</h2>
        <form id="form-login">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="login-usuario" required placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>Seu Nome (Obrigatório para Auditoria)</label>
                <input type="text" id="login-nome-operador" required placeholder="Digite seu nome completo">
            </div>
            <button type="submit" class="btn-submit">Entrar no Sistema</button>
            <div id="mensagem-erro"></div>
        </form>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-1.onrender.com';

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('login-usuario').value.trim();
            const senha = document.getElementById('login-senha').value.trim();
            const nome_operador = document.getElementById('login-nome-operador').value.trim();
            const msgErro = document.getElementById('mensagem-erro');

            msgErro.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha, nome_operador })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('usuario', JSON.stringify(data));
                    
                    if (data.tipo === 'admin') {
                        window.location.href = 'tela_admin.html';
                    } else if (data.tipo === 'deposito') {
                        window.location.href = 'tela_deposito.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    msgErro.innerText = data.erro || 'Credenciais inválidas.';
                    msgErro.style.display = 'block';
                }
            } catch (err) {
                msgErro.innerText = 'Erro ao conectar com o servidor. Verifique sua conexão.';
                msgErro.style.display = 'block';
            }
        });
    </script>
</body>
</html>
