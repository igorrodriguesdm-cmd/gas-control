<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl - Acesso ao Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand i { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
        .brand h1 { font-size: 24px; font-weight: 700; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 15px; }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: var(--primary-dark); }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <i class="fa-solid fa-fire-flame-curved"></i>
            <h1>GasControl</h1>
        </div>
        <div id="erro" class="error-msg"></div>
        <div class="input-group">
            <label>Seu Nome Completo (Obrigatório para Auditoria)</label>
            <input type="text" id="nome-operador" placeholder="Ex: Carlos Silva">
        </div>
        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>
        <button class="btn-login" onclick="fazerLogin()">Entrar no Sistema</button>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-1.onrender.com';

        async function fazerLogin() {
            const nome_operador = document.getElementById('nome-operador').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroDiv = document.getElementById('erro');

            if (!nome_operador) {
                erroDiv.innerText = "Por favor, digite seu nome completo para continuar.";
                erroDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha, nome_operador })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('usuario', JSON.stringify(data));
                    if (data.tipo === 'admin') {
                        window.location.href = 'tela_admin.html';
                    } else {
                        window.location.href = 'tela_deposito.html';
                    }
                } else {
                    erroDiv.innerText = data.erro;
                    erroDiv.style.display = 'block';
                }
            } catch (err) {
                erroDiv.innerText = "Erro ao conectar com o servidor.";
                erroDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
