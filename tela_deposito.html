<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl - Painel Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 20px; }
        .sidebar-brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; color: #fff; }
        .sidebar-brand i { color: var(--primary); }
        .sidebar-menu { list-style: none; flex: 1; }
        .sidebar-menu li { padding: 12px 15px; border-radius: 8px; background: rgba(255,255,255,0.08); color: white; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .sidebar-footer { border-top: 1px solid #334155; padding-top: 15px; }
        .btn-logout { width: 100%; padding: 10px; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { background: var(--card-bg); padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h2 { font-size: 22px; font-weight: 600; }
        
        .container { padding: 30px; max-width: 900px; width: 100%; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 32px; font-weight: 700; }
        .stat-card.cheias p { color: var(--success); }
        .stat-card.vazias p { color: var(--warning); }
        .stat-card.defeito p { color: var(--danger); }

        .action-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 30px; margin-bottom: 20px; }
        .action-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-action.venda { background: var(--success); }
        .btn-action.carreta { background: var(--primary); margin-top: 10px; }

        .alert-toast { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-align: center; display: none; }
        .alert-toast.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .alert-toast.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-fire-flame-curved"></i> GasControl</div>
        <ul class="sidebar-menu">
            <li><i class="fa-solid fa-box-open"></i> Painel Operacional</li>
        </ul>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="sair()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2 id="titulo-deposito">Depósito</h2>
            <div id="nome-operador" style="color: var(--text-muted);">Operador</div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card cheias"><h3>Cheios</h3><p id="qtd-cheias">0</p></div>
                <div class="stat-card vazias"><h3>Vazios</h3><p id="qtd-vazias">0</p></div>
                <div class="stat-card defeito"><h3>Defeito</h3><p id="qtd-defeito">0</p></div>
            </div>

            <!-- Painel de Venda com Troca e Pagamento -->
            <div class="action-card">
                <h3><i class="fa-solid fa-cart-shopping" style="color: var(--success);"></i> Registrar Nova Venda</h3>
                <div class="form-row">
                    <div class="input-group">
                        <label>Quantidade de Botijões</label>
                        <input type="number" id="venda-qtd" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <label>Forma de Pagamento</label>
                        <select id="venda-pagamento">
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="PIX">PIX</option>
                            <option value="Cartão de Crédito">Cartão de Crédito</option>
                            <option value="Cartão de Débito">Cartão de Débito</option>
                        </select>
                    </div>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="venda-troca" checked>
                    O cliente entregou o botijão vazio em troca? (Desmarque se for venda de vasilhame novo/primeira compra)
                </label>
                <button class="btn-action venda" onclick="realizarVenda()"><i class="fa-solid fa-check"></i> Confirmar Venda</button>
            </div>

            <!-- Entrada de Carreta -->
            <div class="action-card">
                <h3><i class="fa-solid fa-truck-ramp-box" style="color: var(--primary);"></i> Entrada de Carreta (Carga Cheia)</h3>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Quantidade de Botijões Cheios Recebidos</label>
                    <input type="number" id="carreta-qtd" value="20" min="1">
                </div>
                <button class="btn-action carreta" onclick="registrarCarreta()"><i class="fa-solid fa-plus"></i> Registrar Entrada de Carreta</button>
            </div>

            <div id="toast" class="alert-toast"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-1.onrender.com';
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));

        if (!usuarioLogado || usuarioLogado.tipo !== 'deposito') window.location.href = 'index.html';

        document.getElementById('titulo-deposito').innerText = usuarioLogado.nome;
        document.getElementById('nome-operador').innerText = usuarioLogado.usuario;

        async function carregarEstoque() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/estoque/${usuarioLogado.deposito_id}`);
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('qtd-cheias').innerText = data.cheias;
                    document.getElementById('qtd-vazias').innerText = data.vazias;
                    document.getElementById('qtd-defeito').innerText = data.defeito;
                }
            } catch (err) { console.error(err); }
        }

        async function realizarVenda() {
            const quantidade = parseInt(document.getElementById('venda-qtd').value);
            const pagamento = document.getElementById('venda-pagamento').value;
            const tem_troca = document.getElementById('venda-troca').checked;

            if (!quantidade || quantidade <= 0) {
                mostrarToast('Informe uma quantidade válida.', 'error');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/vender`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deposito_id: usuarioLogado.deposito_id, quantidade, pagamento, tem_troca })
                });
                const data = await response.json();
                if (response.ok) {
                    mostrarToast(data.mensagem, 'success');
                    carregarEstoque();
                } else {
                    mostrarToast(data.erro, 'error');
                }
            } catch (err) {
                mostrarToast('Erro de comunicação com o servidor.', 'error');
            }
        }

        async function registrarCarreta() {
            const quantidade = parseInt(document.getElementById('carreta-qtd').value);
            if (!quantidade || quantidade <= 0) {
                mostrarToast('Informe uma quantidade válida.', 'error');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/entrada-carreta`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deposito_id: usuarioLogado.deposito_id, quantidade })
                });
                const data = await response.json();
                if (response.ok) {
                    mostrarToast(data.mensagem, 'success');
                    carregarEstoque();
                } else {
                    mostrarToast(data.erro, 'error');
                }
            } catch (err) {
                mostrarToast('Erro de comunicação com o servidor.', 'error');
            }
        }

        function mostrarToast(msg, tipo) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `alert-toast ${tipo}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4000);
        }

        function sair() { localStorage.clear(); window.location.href = 'index.html'; }
        carregarEstoque();
        setInterval(carregarEstoque, 10000);
    </script>
</body>
</html>
