<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GasControl - Depósito</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 22px; }
        .btn-sair { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; }
        .card { background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px solid #ddd; }
        .acoes { margin-top: 20px; display: flex; gap: 10px; }
        button.acao { flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button.acao:hover { background: #218838; }
        .msg { margin-top: 10px; font-weight: bold; color: green; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-sair" onclick="sair()">Sair</button>
        <h1 id="titulo-deposito">Carregando...</h1>
        
        <div class="card">
            <h3>Estoque Atual</h3>
            <p>🈳 Botijões Cheios: <strong id="cheias">0</strong></p>
            <p>⭕ Botijões Vazios: <strong id="vazias">0</strong></p>
            <p>⚠️ Com Defeito: <strong id="defeito">0</strong></p>
        </div>

        <div class="acoes">
            <button class="acao" onclick="realizarAcao('vender')">Registrar Venda (Cheia -> Vazia)</button>
            <button class="acao" onclick="realizarAcao('carreta')">Entrada Carreta</button>
        </div>
        <div id="mensagem" class="msg"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-1.onrender.com';
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));

        if (!usuarioLogado) {
            window.location.href = 'index.html';
        }

        document.getElementById('titulo-deposito').innerText = `Depósito: ${usuarioLogado.deposito_nome || 'Local'}`;

        async function carregarEstoque() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/estoque/${usuarioLogado.deposito_id}`);
                const dados = await response.json();
                
                document.getElementById('cheias').innerText = dados.cheias;
                document.getElementById('vazias').innerText = dados.vazias;
                document.getElementById('defeito').innerText = dados.defeito;
            } catch (err) {
                console.error(err);
                alert('Erro ao carregar estoque.');
            }
        }

        async function realizarAcao(tipo) {
            const endpoint = tipo === 'vender' ? 'vender' : 'entrada-carreta';
            const qtdStr = prompt(tipo === 'vender' ? 'Quantas botijas foram vendidas?' : 'Quantas botijas cheias vieram na carreta?');
            
            if (!qtdStr || isNaN(qtdStr)) return;
            const quantidade = parseInt(qtdStr);

            try {
                const response = await fetch(`${BACKEND_URL}/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deposito_id: usuarioLogado.deposito_id, quantidade })
                });

                const data = await response.json();
                if (response.ok) {
                    document.getElementById('mensagem').innerText = "Operação realizada com sucesso!";
                    carregarEstoque();
                    setTimeout(() => document.getElementById('mensagem').innerText = '', 3000);
                } else {
                    alert(data.erro || 'Erro na operação.');
                }
            } catch (err) {
                console.error(err);
                alert('Erro ao se comunicar com o backend!');
            }
        }

        function sair() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        carregarEstoque();
    </script>
</body>
</html>
