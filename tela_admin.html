<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GasControl - Painel Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .btn-sair { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; }
        .section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-sair" onclick="sair()">Sair</button>
        <h1>Painel Administrativo</h1>
        <p>Visão geral da rede de depósitos.</p>

        <div class="section">
            <h2>Depósitos Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome do Depósito</th>
                        <th>Cheias</th>
                        <th>Vazias</th>
                        <th>Defeituosas</th>
                    </tr>
                </thead>
                <tbody id="tabela-depositos">
                    <tr><td colspan="4">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://gas-control-1.onrender.com';

        async function carregarDashboard() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/dashboard`);
                const dados = await response.json();

                const tbody = document.getElementById('tabela-depositos');
                tbody.innerHTML = '';

                if (dados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Nenhum depósito encontrado.</td></tr>';
                    return;
                }

                dados.forEach(dep => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${dep.nome}</td>
                            <td>${dep.cheias}</td>
                            <td>${dep.vazias}</td>
                            <td>${dep.defeito}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert('Erro ao carregar dados do painel.');
            }
        }

        function sair() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        carregarDashboard();
    </script>
</body>
</html>
