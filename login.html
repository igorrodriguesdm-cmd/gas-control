<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl - Login</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: var(--card-bg); padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 20px; text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        #msgErro { margin-top: 15px; padding: 10px; background-color: #fee2e2; color: #991b1b; border-radius: 6px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔥 GasControl</h2>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>Usuário:</label>
                <input type="text" id="usuario" placeholder="Ex: admin ou dep1" required>
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit">Entrar no Sistema</button>
        </form>
        <div id="msgErro"></div>
    </div>

    <script>
        async function fazerLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('msgErro');

            try {
                // Comunicação com o servidor Python (app.py) rodando na porta 5000
                const response = await fetch('https://gas-control-1.onrender.com/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario, senha })
});

                const resultado = await response.json();

                if (response.ok && resultado.sucesso) {
                    // Salva a sessão no navegador
                    localStorage.setItem('usuarioLogado', JSON.stringify(resultado));

                    // Redireciona com base no perfil que veio do backend
                    if (resultado.perfil === 'adm') {
                        window.location.href = 'tela_admin.html';
                    } else if (resultado.perfil === 'deposito') {
                        // Passa o ID do depósito na URL para a tela saber qual estoque carregar
                        window.location.href = `tela_deposito.html?id=${resultado.deposito_id}`;
                    }
                } else {
                    msgErro.innerText = resultado.erro || "Usuário ou senha inválidos.";
                    msgErro.style.display = 'block';
                }
            } catch (err) {
                msgErro.innerText = "Erro de conexão com o servidor! Verifique se o app.py está rodando.";
                msgErro.style.display = 'block';
            }
        }
    </script>
</body>
</html>
